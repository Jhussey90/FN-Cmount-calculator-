<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT Vision Microscopy Compatibility Calculator</title>

<style>
:root{
    --gt-red:#BA2B2B;
    --gt-red-dark:#9F2323;
    --gt-bg:#F2F2F2;
    --gt-black:#333333;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:30px;
    background:var(--gt-bg);
    font-family:Segoe UI,Arial,sans-serif;
    color:var(--gt-black);
}

.container{
    max-width:950px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:14px;
    border-top:8px solid var(--gt-red);
    box-shadow:0 8px 24px rgba(0,0,0,0.12);
}

.logo{
    text-align:center;
}

.logo h1{
    margin:0;
    font-size:48px;
    font-weight:800;
    color:var(--gt-red);
}

.logo span{
    border:4px solid var(--gt-red);
    border-radius:10px;
    padding:0 10px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin:10px 0 30px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

@media(max-width:750px){
    .grid{
        grid-template-columns:1fr;
    }
}

label{
    display:block;
    margin-bottom:5px;
    color:var(--gt-red);
    font-weight:600;
}

select,input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:2px solid #ddd;
}

select:focus,input:focus{
    outline:none;
    border-color:var(--gt-red);
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    background:var(--gt-red);
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:var(--gt-red-dark);
}

.result{
    margin-top:25px;
    background:#fafafa;
    border-left:6px solid var(--gt-red);
    padding:20px;
    border-radius:10px;
    line-height:1.8;
}

.light{
    width:22px;
    height:22px;
    border-radius:50%;
    display:inline-block;
    margin-left:8px;
    border:1px solid #888;
    vertical-align:middle;
}

.diagram{
    text-align:center;
    margin-top:30px;
}

svg{
    max-width:350px;
}
</style>
</head>
<body>

<div class="container">

<div class="logo">
<h1><span>GT</span>VISION</h1>
</div>

<div class="subtitle">
Microscope Camera • C-Mount • Objective Compatibility Calculator
</div>

<div class="grid">

<div>
<label>Sensor</label>
<select id="sensor" onchange="updateSensor()">
<option value="4.8,3.6">1/3" Sensor</option>
<option value="6.4,4.8">1/2" Sensor</option>
<option value="8.8,6.6">2/3" Sensor</option>
<option value="12.8,9.6">1" Sensor</option>
<option value="8.45,7.07">Sony IMX264</option>
<option value="8.45,7.07">Sony IMX265</option>
<option value="11.3,7.1">Sony IMX250</option>
<option value="13.2,8.8">Sony IMX253</option>
<option value="15.86,13.28">Sony IMX183</option>
<option value="23.5,15.6">APS-C</option>
<option value="36,24">Full Frame</option>
<option value="custom">Custom Sensor</option>
</select>
</div>

<div>
<label>Objective Magnification</label>
<select id="objective">
<option value="0.5">0.5×</option>
<option value="1">1×</option>
<option value="2" selected>2×</option>
<option value="5">5×</option>
<option value="10">10×</option>
<option value="20">20×</option>
<option value="40">40×</option>
<option value="60">60×</option>
<option value="100">100×</option>
</select>
</div>

<div>
<label>Sensor Width (mm)</label>
<input type="number" id="sensorWidth" step="0.01">
</div>

<div>
<label>Sensor Height (mm)</label>
<input type="number" id="sensorHeight" step="0.01">
</div>

<div>
<label>C-Mount Adapter</label>
<select id="cmount">
<option value="1">1× C-Mount</option>
<option value="0.75">0.75× C-Mount</option>
<option value="0.7">0.7× C-Mount</option>
<option value="0.63" selected>0.63× C-Mount</option>
<option value="0.5">0.5× C-Mount</option>
<option value="0.35">0.35× Large Format</option>
<option value="0">1× Direct Projection</option>
</select>
</div>

<div>
<label>Pixel Size (µm)</label>
<input type="number" id="pixelSize" value="3.45" step="0.01">
</div>

</div>

<button onclick="calculate()">
Calculate Compatibility
</button>

<div id="result" class="result">
Select a sensor, adapter and objective then click Calculate.
</div>

<div class="diagram">

<svg viewBox="0 0 300 300">

<circle
id="fieldCircle"
cx="150"
cy="150"
r="120"
fill="#FFF5F5"
stroke="#BA2B2B"
stroke-width="3"/>

<rect
id="sensorRect"
x="100"
y="100"
width="100"
height="80"
fill="rgba(186,43,43,0.35)"
stroke="#BA2B2B"
stroke-width="2"/>

</svg>

</div>

</div>

<script>

function updateSensor(){

    const sensor=document.getElementById("sensor").value;

    if(sensor==="custom"){
        document.getElementById("sensorWidth").value="";
        document.getElementById("sensorHeight").value="";
        return;
    }

    const dims=sensor.split(",");

    document.getElementById("sensorWidth").value=dims[0];
    document.getElementById("sensorHeight").value=dims[1];
}

function calculate(){

    const width=parseFloat(
        document.getElementById("sensorWidth").value);

    const height=parseFloat(
        document.getElementById("sensorHeight").value);

    const objective=parseFloat(
        document.getElementById("objective").value);

    const pixelSize=parseFloat(
        document.getElementById("pixelSize").value);

    const cMount=
        document.getElementById("cmount").value;

    const cMountText=
        document.getElementById("cmount")
        .options[
        document.getElementById("cmount")
        .selectedIndex].text;

    if(!width || !height){
        alert("Please enter valid sensor dimensions.");
        return;
    }

    const sensorDiagonal=
        Math.sqrt(width*width+height*height);

    const adapterImageCircles={
        "1":22.0,
        "0.75":16.5,
        "0.7":15.4,
        "0.63":13.9,
        "0.5":11.0,
        "0.35":7.7
    };

    let imageCircle;

    if(cMount==="0")
        imageCircle=22;
    else
        imageCircle=adapterImageCircles[cMount];

    const sensorUsage=
        (sensorDiagonal/imageCircle)*100;

    let status;
    let colour;
    let fitMessage;

    if(sensorUsage<70){
        status="Undersized Sensor";
        fitMessage="Image circle significantly larger than sensor";
        colour="#F5A623";
    }
    else if(sensorUsage<=90){
        status="Excellent Match";
        fitMessage="Optimal sensor coverage";
        colour="#4CAF50";
    }
    else if(sensorUsage<=100){
        status="Near Limit";
        fitMessage="Close to image circle boundary";
        colour="#F5A623";
    }
    else{
        status="Vignetting Risk";
        fitMessage="Sensor exceeds image circle";
        colour="#D32F2F";
    }

    let format;

    if(sensorDiagonal<6.5)
        format='1/3"';
    else if(sensorDiagonal<8.5)
        format='1/2"';
    else if(sensorDiagonal<11.5)
        format='2/3"';
    else if(sensorDiagonal<16.5)
        format='1"';
    else if(sensorDiagonal<22.5)
        format='4/3"';
    else if(sensorDiagonal<30)
        format='APS-C';
    else
        format='Full Frame';

    let adapterRecommendation;

    if(sensorDiagonal<=8)
        adapterRecommendation="0.5×";
    else if(sensorDiagonal<=11)
        adapterRecommendation="0.63×";
    else if(sensorDiagonal<=16)
        adapterRecommendation="0.7×";
    else if(sensorDiagonal<=22)
        adapterRecommendation="1×";
    else
        adapterRecommendation="Large Format";

    const micronPerPixel=
        pixelSize/objective;

    const fieldOfView=
        imageCircle/objective;

    let objectiveRecommendation;

    if(sensorDiagonal<8)
        objectiveRecommendation="2×";
    else if(sensorDiagonal<12)
        objectiveRecommendation="5×";
    else if(sensorDiagonal<18)
        objectiveRecommendation="10×";
    else if(sensorDiagonal<30)
        objectiveRecommendation="20×";
    else
        objectiveRecommendation="Telecentric";

    document.getElementById("result").innerHTML=`

    <strong>Sensor Format:</strong> ${format}<br>

    <strong>Sensor Diagonal:</strong>
    ${sensorDiagonal.toFixed(2)} mm<br>

    <strong>Selected Adapter:</strong>
    ${cMountText}<br>

    <strong>Recommended Adapter:</strong>
    ${adapterRecommendation}<br>

    <strong>Adapter Image Circle:</strong>
    ${imageCircle.toFixed(2)} mm<br>

    <strong>Sensor Utilisation:</strong>
    ${sensorUsage.toFixed(1)} %<br>

    <strong>Objective:</strong>
    ${objective}×<br>

    <strong>Approx. Field of View:</strong>
    ${fieldOfView.toFixed(2)} mm<br>

    <strong>Sampling:</strong>
    ${micronPerPixel.toFixed(2)} µm/pixel<br>

    <strong>Recommended Objective:</strong>
    ${objectiveRecommendation}<br>

    <strong>Assessment:</strong>
    ${fitMessage}<br>

    <strong>Status:</strong>
    ${status}
    <span class="light"
          style="background:${colour};"></span>

    `;

    drawSensor(width,height,imageCircle);
}

function drawSensor(width,height,imageCircle){

    const rect=
        document.getElementById("sensorRect");

    const circle=
        document.getElementById("fieldCircle");

    const circleRadius=
        (imageCircle/22)*120;

    circle.setAttribute("r",circleRadius);

    let w=width*5;
    let h=height*5;

    if(w>220){

        const scale=220/w;

        w*=scale;
        h*=scale;
    }

    rect.setAttribute("width",w);
    rect.setAttribute("height",h);
    rect.setAttribute("x",150-(w/2));
    rect.setAttribute("y",150-(h/2));
}

updateSensor();

</script>

</body>
</html>
