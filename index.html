<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT Vision Sensor & C-Mount Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    padding: 30px;
}

.container {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.15);
}

h1 {
    color: #00A3E0;
    text-align: center;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #00A3E0;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0088be;
}

.result {
    margin-top: 25px;
    background: #f7f7f7;
    padding: 20px;
    border-radius: 8px;
    font-size: 18px;
}

.light {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: inline-block;
    margin-left: 10px;
    border: 1px solid #666;
    vertical-align: middle;
}

.diagram {
    text-align: center;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>GT Vision Sensor → Objective & C-Mount Calculator</h1>

<label>Sensor</label>
<select id="sensor" onchange="updateSensor()">
    <option value="4.8,3.6">1/3" Sensor</option>
    <option value="6.4,4.8">1/2" Sensor</option>
    <option value="8.8,6.6">2/3" Sensor</option>
    <option value="12.8,9.6">1" Sensor</option>
    <option value="8.45,7.07">Sony IMX264</option>
    <option value="8.45,7.07">Sony IMX265</option>
    <option value="11.3,7.1">Sony IMX250</option>
    <option value="13.2,8.8">Sony IMX253</option>
    <option value="15.86,13.28">Sony IMX183</option>
    <option value="23.5,15.6">APS-C</option>
    <option value="36,24">Full Frame</option>
    <option value="custom">Custom Sensor</option>
</select>

<label>Sensor Width (mm)</label>
<input type="number" id="sensorWidth" step="0.01">

<label>Sensor Height (mm)</label>
<input type="number" id="sensorHeight" step="0.01">

<label>Recommended C-Mount</label>
<input type="text" id="cmount" readonly>

<label>Objective Magnification</label>
<select id="objective">
    <option value="0.5">0.5×</option>
    <option value="1">1×</option>
    <option value="2" selected>2×</option>
    <option value="5">5×</option>
    <option value="10">10×</option>
    <option value="20">20×</option>
    <option value="40">40×</option>
    <option value="60">60×</option>
    <option value="100">100×</option>
</select>

<button onclick="calculate()">Calculate</button>

<div id="result" class="result">
Select a sensor and objective to begin.
</div>

<div class="diagram">

<svg viewBox="0 0 300 300" width="300">

<circle
id="fieldCircle"
cx="150"
cy="150"
r="120"
fill="#d9f2ff"
stroke="#00A3E0"
stroke-width="3"/>

<rect
id="sensorRect"
x="100"
y="100"
width="100"
height="80"
fill="rgba(255,0,0,0.35)"
stroke="#cc0000"
stroke-width="2"/>

</svg>

</div>

</div>

<script>

function updateSensor(){

    const sensor = document.getElementById("sensor").value;

    if(sensor === "custom"){
        document.getElementById("sensorWidth").value = "";
        document.getElementById("sensorHeight").value = "";
        document.getElementById("cmount").value = "";
        return;
    }

    const dims = sensor.split(",");

    document.getElementById("sensorWidth").value = dims[0];
    document.getElementById("sensorHeight").value = dims[1];

    updateCMount();
}

function updateCMount(){

    const width =
        parseFloat(document.getElementById("sensorWidth").value);

    const height =
        parseFloat(document.getElementById("sensorHeight").value);

    if(!width || !height) return;

    const diagonal =
        Math.sqrt(width*width + height*height);

    let cMount;

    if(diagonal <= 6)
        cMount = "1× C-Mount";
    else if(diagonal <= 8)
        cMount = "0.7× C-Mount";
    else if(diagonal <= 12)
        cMount = "0.63× C-Mount";
    else if(diagonal <= 18)
        cMount = "0.5× C-Mount";
    else if(diagonal <= 30)
        cMount = "0.35× Large Format Adapter";
    else
        cMount = "Direct Projection / Large Format";

    document.getElementById("cmount").value = cMount;
}

function calculate(){

    const width =
        parseFloat(document.getElementById("sensorWidth").value);

    const height =
        parseFloat(document.getElementById("sensorHeight").value);

    const objective =
        parseFloat(document.getElementById("objective").value);

    if(!width || !height || !objective){
        alert("Enter valid values.");
        return;
    }

    const fieldNumber = 22;

    const sensorDiagonal =
        Math.sqrt(width*width + height*height);

    const imageCircle =
        fieldNumber / objective;

    const coverage =
        (sensorDiagonal / imageCircle) * 100;

    let status, colour;

    if(coverage < 80){
        status = "Excellent Match";
        colour = "green";
    }
    else if(coverage < 95){
        status = "Acceptable Match";
        colour = "orange";
    }
    else{
        status = "Potential Vignetting";
        colour = "red";
    }

    let objectiveRecommendation;

    if(sensorDiagonal < 8)
        objectiveRecommendation = "2× Objective";
    else if(sensorDiagonal < 12)
        objectiveRecommendation = "5× Objective";
    else if(sensorDiagonal < 18)
        objectiveRecommendation = "10× Objective";
    else if(sensorDiagonal < 30)
        objectiveRecommendation = "20× Objective";
    else
        objectiveRecommendation = "Telecentric Lens";

    let cMount;

    if(sensorDiagonal <= 6)
        cMount = "1× C-Mount";
    else if(sensorDiagonal <= 8)
        cMount = "0.7× C-Mount";
    else if(sensorDiagonal <= 12)
        cMount = "0.63× C-Mount";
    else if(sensorDiagonal <= 18)
        cMount = "0.5× C-Mount";
    else if(sensorDiagonal <= 30)
        cMount = "0.35× Large Format Adapter";
    else
        cMount = "Direct Projection / Large Format";

    document.getElementById("result").innerHTML = `
        <strong>Sensor Diagonal:</strong> ${sensorDiagonal.toFixed(2)} mm<br><br>

        <strong>Image Circle:</strong> ${imageCircle.toFixed(2)} mm<br><br>

        <strong>Coverage:</strong> ${coverage.toFixed(1)}%<br><br>

        <strong>Recommended C-Mount:</strong> ${cMount}<br><br>

        <strong>Recommended Objective:</strong> ${objectiveRecommendation}<br><br>

        <strong>Status:</strong> ${status}
        <span class="light" style="background:${colour};"></span>
    `;

    drawSensor(width,height);
}

function drawSensor(width,height){

    const rect = document.getElementById("sensorRect");

    const scale = 5;

    let w = width * scale;
    let h = height * scale;

    if(w > 220){
        const factor = 220 / w;
        w *= factor;
        h *= factor;
    }

    rect.setAttribute("width",w);
    rect.setAttribute("height",h);
    rect.setAttribute("x",150 - w/2);
    rect.setAttribute("y",150 - h/2);
}

updateSensor();

</script>

</body>
</html>
