<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT Vision Sensor, C-Mount & Objective Calculator</title>

<style>
:root{
    --gt-red:#BA2B2B;
    --gt-red-dark:#9F2323;
    --gt-red-light:#D45050;
    --gt-white:#FFFFFF;
    --gt-bg:#F2F2F2;
    --gt-grey:#666666;
    --gt-black:#333333;
}

*{
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    background:var(--gt-bg);
    padding:30px;
    color:var(--gt-black);
    margin:0;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);
    border-top:8px solid var(--gt-red);
}

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo h1{
    font-size:48px;
    margin:0;
    color:var(--gt-red);
    font-weight:800;
    letter-spacing:2px;
}

.logo span{
    border:4px solid var(--gt-red);
    border-radius:10px;
    padding:0 10px;
    margin-right:6px;
    display:inline-block;
}

.subtitle{
    text-align:center;
    color:var(--gt-grey);
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }
}

label{
    display:block;
    margin-bottom:5px;
    color:var(--gt-red);
    font-weight:600;
}

select,
input{
    width:100%;
    padding:10px;
    border:2px solid #dddddd;
    border-radius:8px;
    transition:0.2s;
}

select:focus,
input:focus{
    outline:none;
    border-color:var(--gt-red);
    box-shadow:0 0 8px rgba(186,43,43,0.2);
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:8px;
    background:var(--gt-red);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:var(--gt-red-dark);
}

.result{
    margin-top:25px;
    background:#fafafa;
    border-left:6px solid var(--gt-red);
    border-radius:10px;
    padding:20px;
    line-height:1.9;
}

.diagram{
    text-align:center;
    margin-top:30px;
    padding:15px;
    background:#fafafa;
    border-radius:10px;
}

.light{
    width:22px;
    height:22px;
    border-radius:50%;
    display:inline-block;
    margin-left:8px;
    border:1px solid #999;
    vertical-align:middle;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:var(--gt-grey);
    font-size:12px;
}

svg{
    max-width:320px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
    <h1><span>GT</span>VISION</h1>
</div>

<div class="subtitle">
    Sensor • C-Mount • Objective Compatibility Calculator
</div>

<div class="grid">

<div>
<label>Sensor</label>
<select id="sensor" onchange="updateSensor()">
    <option value="4.8,3.6">1/3" Sensor</option>
    <option value="6.4,4.8">1/2" Sensor</option>
    <option value="8.8,6.6">2/3" Sensor</option>
    <option value="12.8,9.6">1" Sensor</option>
    <option value="8.45,7.07">Sony IMX264</option>
    <option value="8.45,7.07">Sony IMX265</option>
    <option value="11.3,7.1">Sony IMX250</option>
    <option value="13.2,8.8">Sony IMX253</option>
    <option value="15.86,13.28">Sony IMX183</option>
    <option value="23.5,15.6">APS-C</option>
    <option value="36,24">Full Frame</option>
    <option value="custom">Custom Sensor</option>
</select>
</div>

<div>
<label>Objective Magnification</label>
<select id="objective">
    <option value="0.5">0.5×</option>
    <option value="1">1×</option>
    <option value="2" selected>2×</option>
    <option value="5">5×</option>
    <option value="10">10×</option>
    <option value="20">20×</option>
    <option value="40">40×</option>
    <option value="60">60×</option>
    <option value="100">100×</option>
</select>
</div>

<div>
<label>Sensor Width (mm)</label>
<input type="number" id="sensorWidth" step="0.01">
</div>

<div>
<label>Sensor Height (mm)</label>
<input type="number" id="sensorHeight" step="0.01">
</div>

<div>
<label>C-Mount Adapter</label>
<select id="cmount">
    <option value="1">1× C-Mount</option>
    <option value="0.75">0.75× C-Mount</option>
    <option value="0.7">0.7× C-Mount</option>
    <option value="0.63" selected>0.63× C-Mount</option>
    <option value="0.5">0.5× C-Mount</option>
    <option value="0.35">0.35× Large Format</option>
    <option value="0">Direct Projection</option>
</select>
</div>

</div>

<button onclick="calculate()">
Calculate Compatibility
</button>

<div id="result" class="result">
Choose a sensor, C-mount and objective, then click Calculate.
</div>

<div class="diagram">

<svg viewBox="0 0 300 300">

<circle
id="fieldCircle"
cx="150"
cy="150"
r="120"
fill="#FFF5F5"
stroke="#BA2B2B"
stroke-width="3"/>

<rect
id="sensorRect"
x="100"
y="110"
width="100"
height="80"
fill="rgba(186,43,43,0.35)"
stroke="#BA2B2B"
stroke-width="2"/>

</svg>

</div>

<div class="footer">
GT Vision Microscopy Compatibility Calculator
</div>

</div>

<script>

function updateSensor(){

    const sensor = document.getElementById("sensor").value;

    if(sensor === "custom"){
        document.getElementById("sensorWidth").value = "";
        document.getElementById("sensorHeight").value = "";
        return;
    }

    const dims = sensor.split(",");

    document.getElementById("sensorWidth").value = dims[0];
    document.getElementById("sensorHeight").value = dims[1];
}

function calculate(){

    const width =
        parseFloat(document.getElementById("sensorWidth").value);

    const height =
        parseFloat(document.getElementById("sensorHeight").value);

    const objective =
        parseFloat(document.getElementById("objective").value);

    const cMountFactor =
        parseFloat(document.getElementById("cmount").value);

    const cMountText =
        document.getElementById("cmount").options[
        document.getElementById("cmount").selectedIndex
        ].text;

    if(!width || !height || !objective){
        alert("Please enter valid values.");
        return;
    }

    const sensorDiagonal =
        Math.sqrt(width * width + height * height);

    const fieldNumber = 22;

    let imageCircle;

    if(cMountFactor === 0){
        imageCircle = fieldNumber / objective;
    } else {
        imageCircle = (fieldNumber / objective) * cMountFactor;
    }

    const coverage =
        (sensorDiagonal / imageCircle) * 100;

    let status;
    let fitMessage;
    let colour;

    if(coverage < 60){
        status = "Undersized";
        fitMessage = "Adapter image circle larger than required";
        colour = "#F5A623";
    }
    else if(coverage <= 95){
        status = "Optimal";
        fitMessage = "Good match";
        colour = "#4CAF50";
    }
    else{
        status = "Vignetting Risk";
        fitMessage = "Sensor may exceed image circle";
        colour = "#D32F2F";
    }

    let objectiveRecommendation;

    if(sensorDiagonal < 8)
        objectiveRecommendation = "2× Objective";
    else if(sensorDiagonal < 12)
        objectiveRecommendation = "5× Objective";
    else if(sensorDiagonal < 18)
        objectiveRecommendation = "10× Objective";
    else if(sensorDiagonal < 30)
        objectiveRecommendation = "20× Objective";
    else
        objectiveRecommendation = "Telecentric Lens";

    document.getElementById("result").innerHTML = `
        <strong>Sensor Diagonal:</strong> ${sensorDiagonal.toFixed(2)} mm<br>

        <strong>Selected C-Mount:</strong> ${cMountText}<br>

        <strong>Effective Image Circle:</strong> ${imageCircle.toFixed(2)} mm<br>

        <strong>Coverage:</strong> ${coverage.toFixed(1)}%<br>

        <strong>C-Mount Assessment:</strong> ${fitMessage}<br>

        <strong>Recommended Objective:</strong> ${objectiveRecommendation}<br>

        <strong>Status:</strong> ${status}
        <span class="light" style="background:${colour};"></span>
    `;

    drawSensor(width,height);
}

function drawSensor(width,height){

    const rect =
        document.getElementById("sensorRect");

    const scale = 5;

    let w = width * scale;
    let h = height * scale;

    if(w > 220){

        const factor = 220 / w;

        w *= factor;
        h *= factor;
    }

    rect.setAttribute("width",w);
    rect.setAttribute("height",h);

    rect.setAttribute(
        "x",
        150 - (w / 2)
    );

    rect.setAttribute(
        "y",
        150 - (h / 2)
    );
}

updateSensor();

</script>

</body>
</html>
